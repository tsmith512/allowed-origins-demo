
<!DOCTYPE html>

      <title>Stream Allowed Origins Demo</title>

      <style>
        html {
          background: #222;

        html,
        body {
          margin: 0px;
        }

        body {
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        section {
          --video-aspect-ratio: 1920 / 1080;
          --padding: 4em;

          box-sizing: border-box;
          width: calc(
            (100vh - (2 * var(--padding))) * var(--video-aspect-ratio)
          );
          max-width: 100%;
          padding: var(--padding);
        }

        iframe {
          display: block;
          width: 1080px;
          max-width: 100%;
          margin: 0 auto;
          box-shadow: 0 0 30px #000;
          box-shadow: 0 0 5vmin #000;
          aspect-ratio: var(--video-aspect-ratio);
        }

        @media (max-width: 768px) {
          html {
            background: #000;
          }

          section {
            --padding: 0px;
          }

          stream {
            box-shadow: none;
          }
        }
      </style>
    </head>
    <body>
      <section>
        <div style="position: relative; padding-top: 56.25%;">
          <iframe
            src="https://customer-igynxd2rwhmuoxw8.cloudflarestream.com/0e0c90da886f3ed8402322963083a10c/iframe?muted=true&loop=true&autoplay=true&poster=https%3A%2F%2Fcustomer-igynxd2rwhmuoxw8.cloudflarestream.com%2F0e0c90da886f3ed8402322963083a10c%2Fthumbnails%2Fthumbnail.jpg%3Ftime%3D%26height%3D600"

            style="border: none; position: absolute; top: 0; left: 0; height: 100%; width: 100%;"

          ></iframe>
        </div>

    </body>
  </html>
